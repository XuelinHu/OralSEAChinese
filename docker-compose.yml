services:
  postgres:
    image: postgres:16
    container_name: oralsea-postgres
    environment:
      POSTGRES_DB: oralsea_chinese
      POSTGRES_USER: oralsea
      POSTGRES_PASSWORD: oralsea_dev
    ports:
      - "5432:5432"
    volumes:
      - oralsea_postgres_data:/var/lib/postgresql/data

volumes:
  oralsea_postgres_data:
